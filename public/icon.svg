      fill="#FEF08A"
      stroke="#EA580C"
      stroke-width="1.8"
    />
    <circle cx="56" cy="20" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Sugarcane Stalks -->
  <g stroke="#15803D" stroke-width="3.5" fill="none">
    <path d="M 120,470 Q 145,340 165,260 Q 150,250 135,265" />
    <path d="M 392,470 Q 367,340 347,260 Q 362,250 377,265" />
