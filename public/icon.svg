  <path d="M 165,260 Q 180,230 170,210 Q 160,235 165,260" fill="#22C55E" />
  <path d="M 347,260 Q 332,230 342,210 Q 352,235 347,260" fill="#22C55E" />

  <!-- Bottom Brand Text -->
  <rect x="0" y="456" width="512" height="56" fill="#0A1A2E" opacity="0.95" />
  <text
    x="256"
    y="492"
    fill="#FDE68A"
    font-size="22"
    font-weight="900"
    letter-spacing="3"
    text-anchor="middle"
    font-family="'Mukta', sans-serif"
  >
    DEO CHHATH SEVA
  </text>
</svg>
