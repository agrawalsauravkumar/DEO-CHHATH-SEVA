<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- DEO CHHATH SEVA OFFICIAL APP LOGO -->
  <!-- NEXTGEN DEVBHOOMI FOUNDATION -->
  <!-- "रास्ता भी • सहायता भी • सेवा भी" -->
  <defs>
    <!-- Background Outer Ring Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B5E8E" />
      <stop offset="50%" stopColor="#073B5A" />
      <stop offset="100%" stopColor="#041E2F" />
    </linearGradient>

    <!-- Sun & Sunrise Aura Gradient -->
    <radialGradient id="logoSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFF8E1" />
      <stop offset="25%" stopColor="#FFD54F" />
      <stop offset="65%" stopColor="#FF8C42" />
      <stop offset="100%" stopColor="#E65100" />
    </radialGradient>

    <!-- Sacred Waters Gradient -->
    <linearGradient id="logoWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0B5E8E" />
      <stop offset="50%" stopColor="#29B6F6" />
      <stop offset="100%" stopColor="#0288D1" />
    </linearGradient>

    <!-- Marigold Gold Border Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFE082" />
      <stop offset="25%" stopColor="#FFD54F" />
      <stop offset="50%" stopColor="#FFB300" />
      <stop offset="75%" stopColor="#FFA000" />
      <stop offset="100%" stopColor="#FF8F00" />
    </linearGradient>

    <!-- Top Text Path -->
    <path id="topTextArc" d="M 68,256 A 188,188 0 1,1 444,256" />
  </defs>

  <!-- 1. Outer Ornate Marigold Gold Border Rings -->
  <circle cx="256" cy="256" r="252" fill="url(#logoGoldGrad)" />
  <circle cx="256" cy="256" r="246" fill="#041E2F" />
  <circle cx="256" cy="256" r="242" fill="url(#logoBgGrad)" stroke="#FFD54F" stroke-width="2" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#FFE082" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- 2. Organization Name in Top Ring -->
  <text fill="#FFFFFF" font-size="20" font-weight="900" letter-spacing="2.8" font-family="'Mukta', 'Segoe UI', sans-serif">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      NEXTGEN DEVBHOOMI FOUNDATION
    </textPath>
  </text>

  <!-- 3. Inner Sacred Artwork Window -->
  <g>
    <!-- Inner Circle Container -->
    <circle cx="256" cy="256" r="182" fill="#FFF8E1" stroke="#FFD54F" stroke-width="4" />
    <clipPath id="innerPortalClip">
      <circle cx="256" cy="256" r="180" />
    </clipPath>

    <g clip-path="url(#innerPortalClip)">
      <!-- Warm Sunrise Sky -->
      <rect x="76" y="76" width="360" height="360" fill="#FFF8E1" />

      <!-- Morning Aura Radial Sunburst -->
      <circle cx="256" cy="205" r="160" fill="#FFE082" opacity="0.4" />
      <circle cx="256" cy="205" r="120" fill="#FFCC80" opacity="0.5" />

      <!-- Radiating Golden Rays (भगवान सूर्य की किरणें) -->
      <g stroke="#FFB300" stroke-width="2.5" opacity="0.85">
        <line x1="256" y1="205" x2="256" y2="82" />
        <line x1="256" y1="205" x2="335" y2="95" />
        <line x1="256" y1="205" x2="177" y2="95" />
        <line x1="256" y1="205" x2="390" y2="135" />
        <line x1="256" y1="205" x2="122" y2="135" />
        <line x1="256" y1="205" x2="415" y2="190" />
        <line x1="256" y1="205" x2="97" y2="190" />
        <line x1="256" y1="205" x2="298" y2="88" stroke-width="1.8" />
        <line x1="256" y1="205" x2="214" y2="88" stroke-width="1.8" />
      </g>

      <!-- Radiant Surya Dev Morning Sun (भगवान भास्कर) -->
      <circle cx="256" cy="205" r="64" fill="url(#logoSunGlow)" stroke="#E65100" stroke-width="2.5" />
      <circle cx="256" cy="205" r="54" fill="#FFF8E1" opacity="0.25" />

      <!-- Ancient Deo Sun Temple Shikhara Silhouette (देव सूर्य मंदिर) -->
      <g transform="translate(148, 172)">
        <path
          d="M 38,0 C 33,26 22,54 13,84 L 63,84 C 54,54 43,26 38,0 Z"
          fill="#8D6E63"
          stroke="#5D4037"
          stroke-width="1.8"
        />
        <!-- Amalaka & Kalash -->
        <ellipse cx="38" cy="0" rx="7" ry="3.5" fill="#FFD54F" />
        <circle cx="38" cy="-5" r="3" fill="#FFA000" />
        <line x1="38" y1="-10" x2="38" y2="-4" stroke="#8D6E63" stroke-width="1.8" />
        <polygon points="38,-10 52,-7 38,-4" fill="#FF8C42" />
        <!-- Temple Architectural Carvings -->
        <path d="M 18,68 Q 38,64 58,68" stroke="#D7CCC8" stroke-width="1.5" fill="none" />
        <path d="M 23,52 Q 38,48 53,52" stroke="#D7CCC8" stroke-width="1.5" fill="none" />
        <path d="M 28,36 Q 38,33 48,36" stroke="#D7CCC8" stroke-width="1.5" fill="none" />
      </g>

      <!-- Sacred Holy Surya Kund Water Waves (सूर्य कुंड व पवित्र जल) -->
      <path
        d="M 76,285 C 130,272 195,296 256,285 C 317,274 382,298 436,285 L 436,436 L 76,436 Z"
        fill="url(#logoWaterGrad)"
      />
      <!-- Water Ripples -->
      <path
        d="M 76,315 C 130,305 190,322 256,312 C 322,302 382,320 436,310"
        stroke="#E1F5FE"
        stroke-width="3"
        fill="none"
        opacity="0.8"
      />
      <path
        d="M 90,345 C 150,336 210,350 270,342 C 330,334 390,348 436,340"
        stroke="#B3E5FC"
        stroke-width="2.5"
        fill="none"
        opacity="0.6"
      />

      <!-- Sacred Ghat Steps (पवित्र घाट सीढ़ियाँ) -->
      <path
        d="M 76,370 L 160,370 L 160,384 L 250,384 L 250,398 L 436,398 L 436,436 L 76,436 Z"
        fill="#0B5E8E"
        opacity="0.8"
      />

      <!-- Twin Sacred Sugarcane Stalks (पवित्र ईख / गन्ना) -->
      <g stroke="#2E7D32" stroke-width="3.5" fill="none">
        <path d="M 125,415 Q 148,310 166,245 Q 152,235 138,250" />
        <path d="M 387,415 Q 364,310 346,245 Q 360,235 374,250" />
      </g>
      <!-- Sugarcane Leaf Bunches -->
      <path d="M 166,245 Q 182,218 172,198 Q 160,224 166,245" fill="#4CAF50" />
      <path d="M 346,245 Q 330,218 340,198 Q 352,224 346,245" fill="#4CAF50" />

      <!-- Chhath Arghya Offering: Bamboo Soop & Holy Diya (अर्घ्य सूप व दीप) -->
      <g transform="translate(206, 318)">
        <!-- Golden Bamboo Soop -->
        <path
          d="M 12,36 C 22,22 78,22 88,36 C 92,46 80,58 50,58 C 20,58 8,46 12,36 Z"
          fill="#FFD54F"
          stroke="#FFA000"
          stroke-width="2.5"
        />
        <!-- Offerings inside Soop: Coconut, Banana & Thekua -->
        <circle cx="50" cy="30" r="11" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5" />
        <ellipse cx="36" cy="35" rx="7" ry="5" fill="#FF8C42" />
        <ellipse cx="64" cy="35" rx="7" ry="5" fill="#FFCA28" />

        <!-- Sacred Diya Base -->
        <path d="M 44,24 Q 50,28 56,24 Q 54,32 46,32 Z" fill="#FF8C42" stroke="#E65100" stroke-width="1" />
        <!-- Divine Diya Flame (अखण्ड ज्योति) -->
        <path
          d="M 50,8 C 55,14 56,18 53,22 C 50,24 47,21 47,18 C 47,15 48,11 50,8 Z"
          fill="#FFF9C4"
          stroke="#FF8C42"
          stroke-width="1.8"
        />
        <circle cx="50" cy="18" r="3" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Inner Golden Border Bezel -->
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#logoGoldGrad)" stroke-width="4.5" />
  </g>

  <!-- 4. Lower Banner: DEO CHHATH SEVA & TAGLINE (Clean Horizontal Layout) -->
  <g>
    <rect x="80" y="415" width="352" height="66" rx="18" fill="#041E2F" stroke="#FFD54F" stroke-width="2.5" />
    <text
      x="256"
      y="442"
      fill="#FFD54F"
      font-size="20"
      font-weight="900"
      letter-spacing="2.5"
      text-anchor="middle"
      font-family="'Mukta', 'Segoe UI', sans-serif"
    >
      DEO CHHATH SEVA
    </text>
    <text
      x="256"
      y="464"
      fill="#FFF8E1"
      font-size="12.5"
      font-weight="700"
      letter-spacing="1.2"
      text-anchor="middle"
      font-family="'Mukta', 'Segoe UI', sans-serif"
    >
      रास्ता भी • सहायता भी • सेवा भी
    </text>
  </g>
</svg>
