name: Build Android APK and AAB

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Web Production Assets
        env:
          VITE_API_BASE_URL: https://seva.nextgendevbhoomi.org
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Build Android Release App Bundle (AAB)
        run: cd android && ./gradlew bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: deo-chhath-seva-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: deo-chhath-seva-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

